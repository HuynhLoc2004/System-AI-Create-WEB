services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it_enterprise_app
    restart: always
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DB_FILE=/app/server/data/production.db.json
      - MASTER_AUTH_SALT=IT_ASSIGNMENT_SUPER_SECRET_SALT_2026_@#!$%
    volumes:
      - app_data:/app/server/data
    ports:
      - "5000:5000"
    depends_on:
      - redis
    networks:
      - it_network

  redis:
    image: redis:7-alpine
    container_name: it_enterprise_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - it_network

  postgres:
    image: postgres:16-alpine
    container_name: it_enterprise_postgres
    restart: always
    environment:
      POSTGRES_DB: it_assignment_db
      POSTGRES_USER: it_admin
      POSTGRES_PASSWORD: SecretProdPassword2026!
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./07_Database_Management/02_migrations_and_seeds/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - it_network

networks:
  it_network:
    driver: bridge

volumes:
  app_data:
  redis_data:
  pg_data:

