# ========================================================
# CẤU HÌNH NGINX REVERSE PROXY CHUẨN BẢO MẬT CAO SSL TLS 1.3
# ========================================================

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Tối ưu hóa hiệu năng truyền tải
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Nén Gzip tiết kiệm băng thông
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting bảo vệ máy chủ (100 req/s cho mỗi IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # 1. TỰ ĐỘNG CHUYỂN HƯỚNG HTTP SANG HTTPS
    server {
        listen 80;
        server_name domain.com www.domain.com api.domain.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. MÁY CHỦ BẢO MẬT CHO BACKEND API (api.domain.com)
    server {
        listen 443 ssl http2;
        server_name api.domain.com;

        # Chứng chỉ bảo mật SSL Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/api.domain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.domain.com/privkey.pem;

        # Giao thức bảo mật mạnh nhất: TLS 1.2 & TLS 1.3
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Tiêu đề an ninh mạng (Security Headers)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend-core:3000;
            proxy_http_version 1.1;

            # Cấu hình kết nối hai chiều WebSocket (Bắt buộc cho Socket.io)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Gắn IP thật của khách hàng qua lớp Proxy
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 3. MÁY CHỦ GIAO DIỆN FRONTEND (domain.com)
    server {
        listen 443 ssl http2;
        server_name domain.com www.domain.com;

        ssl_certificate /etc/letsencrypt/live/domain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/domain.com/privkey.pem;

        location / {
            proxy_pass http://frontend-web:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}

