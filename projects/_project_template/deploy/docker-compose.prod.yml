version: "3.8"

# CỤM DỊCH VỤ SẢN XUẤT THỰC TẾ TRÊN MÁY CHỦ PRODUCTION (ZERO-DOWNTIME)
services:
  # Cổng vào Reverse Proxy & Chứng chỉ SSL TLS 1.3
  nginx:
    image: nginx:1.25-alpine
    container_name: app-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  # Giao diện Frontend (Next.js SSR)
  frontend:
    image: ghcr.io/org/project-frontend:latest
    container_name: app-frontend
    restart: always
    env_file:
      - ../config/production.env
    networks:
      - app-network

  # Bộ não Backend API (NestJS Node.js)
  backend:
    image: ghcr.io/org/project-backend:latest
    container_name: app-backend
    restart: always
    env_file:
      - ../config/production.env
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - app-network

  # Worker xử lý hàng đợi ngầm (Gửi mail, xử lý ảnh, webhook)
  backend-worker:
    image: ghcr.io/org/project-backend:latest
    container_name: app-worker
    restart: always
    command: ["node", "dist/worker.js"]
    env_file:
      - ../config/production.env
    depends_on:
      - redis-cache
      - postgres-db
    networks:
      - app-network

  # Cơ sở dữ liệu PostgreSQL Dedicated
  postgres-db:
    image: postgres:16-alpine
    container_name: app-postgres
    restart: always
    env_file:
      - ../config/production.env
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_backend_user -d enterprise_production_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Bộ nhớ đệm Redis
  redis-cache:
    image: redis:7-alpine
    container_name: app-redis
    restart: always
    command: ["redis-server", "--requirepass", "CHANGE_ME_STRONG_PRODUCTION_REDIS_PASSWORD_2026!", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "CHANGE_ME_STRONG_PRODUCTION_REDIS_PASSWORD_2026!", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  prod_postgres_data:
  prod_redis_data:

